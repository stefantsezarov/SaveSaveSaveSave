<style>
  :root {
    --bg: #F2F4F6;
    --surface: #FFFFFF;
    --surface-border: #E1E6EA;
    --text: #16202B;
    --text-muted: #5B6672;
    --accent: #2B6E63;
    --accent-soft: #E4EFEC;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D141D;
      --surface: #161F2C;
      --surface-border: #263140;
      --text: #E8ECF0;
      --text-muted: #93A0AC;
      --accent: #57C7B3;
      --accent-soft: #17352E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D141D;
    --surface: #161F2C;
    --surface-border: #263140;
    --text: #E8ECF0;
    --text-muted: #93A0AC;
    --accent: #57C7B3;
    --accent-soft: #17352E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .card {
    width: 100%;
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 14px;
    padding: 44px 40px 36px;
  }

  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 14px;
  }

  h1 {
    font-family: "Source Serif 4", Georgia, serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.15;
    margin: 0 0 6px;
    text-wrap: balance;
  }

  .role {
    font-size: 14.5px;
    color: var(--text-muted);
    margin: 0 0 28px;
    max-width: 46ch;
    line-height: 1.5;
  }

  .divider {
    height: 1px;
    background: var(--surface-border);
    border: none;
    margin: 0 0 30px;
  }

  .photos {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    align-items: flex-start;
    margin-bottom: 30px;
  }

  .photo-block {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .photo-block img {
    display: block;
    height: 168px;
    width: auto;
    border-radius: 10px;
  }

  .photo-caption {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  footer {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    border-top: 1px solid var(--surface-border);
    padding-top: 20px;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-soft);
  }

  footer a:hover {
    border-bottom-color: var(--accent);
  }

  @media (max-width: 480px) {
    .card { padding: 32px 24px 28px; }
    h1 { font-size: 26px; }
    .photo-block img { height: 140px; }
  }
</style>
