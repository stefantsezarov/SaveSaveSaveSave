# Publish the agent package to npm when a version tag is pushed.
#
# Uses npm trusted publishing (OIDC): npm accepts this workflow, on this
# repository, as the publisher. No npm token is stored anywhere, and every
# release carries signed provenance that links it to this exact commit.
# Configured on npmjs.com: package savesavesavesave -> Settings -> Trusted
# publisher -> GitHub Actions, stefantsezarov/SaveSaveSaveSave, publish.yml,
# with "Allow npm publish" OFF. So this workflow can only STAGE a version:
# it goes public after a maintainer approves it with 2FA on npmjs.com or
# with `npm stage approve`. A stolen workflow run cannot ship a release.
#
# Release: bump agent/package.json and agent/server.json, merge to main,
# push a matching tag (git tag v0.1.5 && git push origin v0.1.5), then
# approve the staged version on npmjs.com.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # required for trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the on-main check below needs history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or later; staging is newer still.
      - run: npm install -g npm@11.21.1   # pinned: this job holds id-token; bump deliberately
      - name: Tag, package.json and server.json agree on the version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./agent/package.json').version")
          SRV=$(node -p "require('./agent/server.json').version")
          echo "tag=$TAG package=$PKG server=$SRV"
          test "$TAG" = "$PKG" && test "$TAG" = "$SRV"
      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Agent tests
        run: node agent/agent.test.js
      - name: Stage for approval
        working-directory: agent
        run: npm stage publish --access public
