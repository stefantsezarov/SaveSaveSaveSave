# Run every suite in this repository on push and on pull request.
#
# WHY THIS EXISTS. Until now the only workflow here checked the LIVE
# site, ninety seconds after a deploy. That is the right check to have,
# but it is the last possible moment to find out — the broken version is
# already public by the time it runs, and it can only see what a browser
# can see from outside.
#
# These suites run before that, on the files themselves, and they cover
# the things a live fetch cannot: the engine's verdicts, the scan model's
# combination policy, the XSS boundary, the advertising isolation, and
# whether the code embedded in index.html is the code the tests just
# passed. That last one matters most — a fix to a module the page does
# not load has shipped from this repository before.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default single commit. seo.js dates every
      # page from its git history; in a one-commit clone each page looks
      # published today, and the SEO check below fails on dates that are
      # right in the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Before anything else. Every suite below that reads index.html is
      # only meaningful if the page really carries the modules it claims.
      - name: The page contains the engine the tests are about to check
        run: node verify_embedded.js

      - name: Message engine
        run: node promptscan.test.js
      - name: Page integration, XSS and advertising isolation
        run: node promptscan.ui.test.js
      - name: Live scan console
        run: node scanconsole.test.js
      - name: Address engine regressions
        run: node savesavesavesave.regression.test.js
      - name: Scan model
        run: node scanmodel.test.js
      - name: Provider routing
        run: node goplus-routing.test.js
      - name: Proxy Worker deploy config keeps logging off
        run: node proxy-config.test.js
      - name: Spot the Trap content, pages and script
        run: node challenge.test.js
      - name: Published guides still match the engine
        run: node guide-examples.test.js
      - name: Red team
        run: node redteam.js
      - name: Titles, cards, structured data
        run: node seo.test.js
      - name: Agent package and MCP server
        run: node agent/agent.test.js

      # Not a test: it rewrites files. Running it here proves the route
      # policy is already applied, because a clean tree means the
      # committed pages match the policy they are supposed to follow.
      - name: Advertising route policy is already applied
        run: |
          node apply-ads.js
          git diff --exit-code || (echo "::error::apply-ads.js changed files — the committed pages do not match AD_POLICY" && exit 1)

      # Same idea: the head blocks in the repository must be the ones
      # seo.js would write. Structured data that drifts from the page is
      # worse than none, and it drifts silently.
      - name: SEO blocks are already applied
        run: node seo.js --check

  # The published GitHub Action, run against the real npm registry and
  # OSV.dev: a known-clean package must pass and a package npm removed for
  # security must fail the job. Offline unit tests cannot prove either.
  dependency-action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A clean dependency passes
        uses: ./
        with:
          path: .github/action-fixtures/clean
      - name: A removed-for-security dependency fails
        id: bad
        continue-on-error: true
        uses: ./
        with:
          path: .github/action-fixtures/bad
      - name: The bad fixture really failed
        run: test "${{ steps.bad.outcome }}" = "failure"

  # Spot the Trap release gate. Fails while any scenario is unapproved
  # (reviewed: null) or carries a date that is not a real past date.
  # Runs on pull requests INTO main and on main itself only, so feature
  # branches and their previews can still carry draft scenarios for
  # review. It blocks a merge only if branch protection requires it.
  spot-the-trap-release:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Every published scenario is approved and the pages are current
        run: node build-challenges.js --release --check
